spring:
  # Optional local secrets file (git-ignored). Environment variables take precedence.
  config:
    import: optional:file:.env[.properties]

  application:
    name: admin-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/admin_db}
    username: ${DB_USERNAME:admin_service}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-init-sql: SET TIME ZONE 'UTC'

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8088}
  # X-User-Id / X-User-Roles are trusted only because callers reach this service through the API Gateway alone,
  # which validates the JWT and strips any client-supplied value (same model as billing-service and family-service).
  address: ${SERVER_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

admin:
  downstream:
    # Where the aggregates come from. Calls use /internal/** with the shared secret; nothing personal is ever requested.
    user-service-url: ${USERS_SERVICE_URL:http://127.0.0.1:8082}
    billing-service-url: ${BILLING_SERVICE_URL:http://127.0.0.1:8093}
    family-service-url: ${FAMILY_SERVICE_URL:http://127.0.0.1:8086}
    timeout: ${ADMIN_DOWNSTREAM_TIMEOUT:2s}
  # name=base-url pairs probed at <base-url>/actuator/health by the System page.
  health-targets: >-
    api-gateway=http://127.0.0.1:8080,
    auth-service=http://127.0.0.1:8081,
    user-service=http://127.0.0.1:8082,
    transaction-service=http://127.0.0.1:8083,
    notification-service=http://127.0.0.1:8084,
    family-service=http://127.0.0.1:8086,
    reports-analytics-service=http://127.0.0.1:8089,
    budget-service=http://127.0.0.1:8090,
    subscription-service=http://127.0.0.1:8091,
    goal-service=http://127.0.0.1:8092,
    billing-service=http://127.0.0.1:8093

internal:
  # Shared secret for service-to-service calls (header X-Internal-Token). Empty = the calls to other services fail.
  api-token: ${INTERNAL_API_TOKEN:}
