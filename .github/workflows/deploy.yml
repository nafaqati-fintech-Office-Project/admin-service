name: Deploy to VPS

# Every push to main sends this service's source to the VPS, where /opt/fintech/deploy.sh builds the image, restarts
# only this container and rolls back if it does not start. Needs the secrets VPS_HOST, VPS_USER, VPS_SSH_KEY.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: { group: deploy-vps-admin-service, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Upload source, build and restart on the VPS
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: git archive --format=tar.gz HEAD | ssh "$VPS" /opt/fintech/deploy.sh admin-service
