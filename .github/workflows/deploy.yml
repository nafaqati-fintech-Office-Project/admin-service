name: Deploy to VPS

# Every push to main sends this service's source to the VPS, where /opt/fintech/deploy.sh builds the image, restarts
# only this container and rolls back if it does not start. Needs the secrets VPS_HOST, VPS_USER, VPS_SSH_KEY.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: { group: deploy-vps-admin-service, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # Repairs what copying a key out of a terminal or Windows does to it: CRLF line ends, spaces at line ends, blank lines,
          # or the whole key joined into one line. Prints only the key's shape, never its content.
          python3 - <<'PY'
          import os, re, textwrap
          raw = os.environ["VPS_SSH_KEY"].replace("\r", "")
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", raw, re.S)
          if not m and re.sub(r"\s+", "", raw).startswith("b3BlbnNzaC1rZXktdjE"):
              # only the base64 body was copied (the BEGIN/END lines were left out): it is an OpenSSH key, put them back
              raw = "-----BEGIN OPENSSH PRIVATE KEY-----\n" + raw.strip() + "\n-----END OPENSSH PRIVATE KEY-----"
              m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", raw, re.S)
          if not m:
              first = raw.strip().split()[0] if raw.strip() else "(empty)"
              kind = "a PUBLIC key (.pub)" if first.startswith("ssh-") else "a PuTTY .ppk key" if "PuTTY" in raw else f"something else (starts with {first[:12]!r})"
              raise SystemExit(f"VPS_SSH_KEY has no BEGIN/END PRIVATE KEY block: it looks like {kind}")
          label, body = m.group(1), re.sub(r"\s+", "", m.group(2))
          key = f"-----BEGIN {label}-----\n" + "\n".join(textwrap.wrap(body, 70)) + f"\n-----END {label}-----\n"
          path = os.path.expanduser("~/.ssh/id_ed25519")
          with open(path, "w") as f:
              f.write(key)
          print(f"key shape: {label}, {len(raw.splitlines())} lines as stored, {len(body)} base64 characters")
          PY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "VPS_SSH_KEY is still not a readable private key (protected by a passphrase, or cut off when copied)"; exit 1; }
          echo "deploy key OK"
          for i in 1 2 3 4 5; do ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 5; done
          test -s ~/.ssh/known_hosts
      - name: Upload source, build and restart on the VPS
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: git archive --format=tar.gz HEAD | ssh "$VPS" /opt/fintech/deploy.sh admin-service
